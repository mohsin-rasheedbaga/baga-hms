name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 3.3.2)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (static export)
        run: npm run build

      - name: Inject GH token into electron/config.json
        shell: bash
        run: echo '{"gh_token":"${{ secrets.GH_PAT }}"}' > electron/config.json

      - name: Build Electron app
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Get version from package.json
        id: pkg-version
        shell: bash
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: List build outputs
        shell: bash
        run: ls -la dist-electron/*.yml dist-electron/*.blockmap dist-electron/*.exe 2>/dev/null || echo "Listing all:"; ls -la dist-electron/

      - name: Upload Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: BAGA-HMS-Setup-${{ steps.pkg-version.outputs.VERSION }}
          path: dist-electron/BAGA-HMS-Setup-*.exe

      - name: Upload Portable
        uses: actions/upload-artifact@v4
        with:
          name: BAGA-HMS-Portable-${{ steps.pkg-version.outputs.VERSION }}
          path: dist-electron/BAGA-HMS-Portable-*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: BAGA HMS v${{ steps.pkg-version.outputs.VERSION }}
          body: |
            ## BAGA Hospital Management System v${{ steps.pkg-version.outputs.VERSION }}
            ### Downloads:
            - **Setup Installer (.exe)** — Standard installer (recommended)
            - **Portable (.exe)** — No installation required
            ### Changes:
            - Auto-update system with electron-updater
            - POS module redesign
            - License guard system
            - Pharmacy and lab improvements
            - Various UI fixes
          files: |
            dist-electron/BAGA-HMS-Setup-*.exe
            dist-electron/BAGA-HMS-Setup-*.exe.blockmap
            dist-electron/latest.yml
            dist-electron/BAGA-HMS-Portable-*.exe
          draft: false
          prerelease: false
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 2.6.0)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (static export)
        run: npm run build

      - name: Build Electron app
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from package.json
        id: pkg-version
        shell: bash
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create Delta Update ZIP
        shell: bash
        run: |
          VERSION="${{ steps.pkg-version.outputs.VERSION }}"
          mkdir -p delta-update
          cp -r out delta-update/out
          cp -r electron delta-update/electron
          cd delta-update
          7z a -tzip "../BAGA-HMS-Update-${VERSION}.zip" out electron
          cd ..
          echo "Delta ZIP created: BAGA-HMS-Update-${VERSION}.zip"
          ls -lh "BAGA-HMS-Update-${VERSION}.zip"

      - name: Upload Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: BAGA-HMS-Setup-${{ steps.pkg-version.outputs.VERSION }}
          path: dist-electron/BAGA-HMS-Setup-*.exe

      - name: Upload Portable
        uses: actions/upload-artifact@v4
        with:
          name: BAGA-HMS-Portable-${{ steps.pkg-version.outputs.VERSION }}
          path: dist-electron/BAGA-HMS-Portable-*.exe

      - name: Upload latest.yml
        uses: actions/upload-artifact@v4
        with:
          name: latest-yml
          path: dist-electron/latest.yml

      - name: Upload blockmap
        uses: actions/upload-artifact@v4
        with:
          name: setup-blockmap
          path: dist-electron/BAGA-HMS-Setup-*.exe.blockmap

      - name: Upload Delta Update ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BAGA-HMS-Update-${{ steps.pkg-version.outputs.VERSION }}
          path: BAGA-HMS-Update-${{ steps.pkg-version.outputs.VERSION }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        with:
          name: BAGA HMS v${{ steps.pkg-version.outputs.VERSION }}
          body: |
            ## BAGA Hospital Management System v${{ steps.pkg-version.outputs.VERSION }}
            ### Downloads:
            - **Setup Installer (.exe)** — Standard installer
            - **Portable (.exe)** — No installation required
            - **Delta Update (.zip)** — Small update (recommended), preserves all data
          files: |
            dist-electron/BAGA-HMS-Setup-*.exe
            dist-electron/BAGA-HMS-Setup-*.exe.blockmap
            dist-electron/latest.yml
            dist-electron/BAGA-HMS-Portable-*.exe
            BAGA-HMS-Update-${{ steps.pkg-version.outputs.VERSION }}.zip
          draft: false
          prerelease: false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
